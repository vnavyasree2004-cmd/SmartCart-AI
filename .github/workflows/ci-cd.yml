name: SmartCart CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy psycopg2-binary python-multipart python-jose passlib bcrypt pandas scikit-learn pillow opencv-contrib-python-headless SpeechRecognition pydub

      - name: Check backend syntax
        run: |
          python -m py_compile backend/main.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Docker build test
        run: |
          docker build -t smartcart-backend:test .
